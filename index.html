<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>To‑Do List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" id="app">
      <header class="app-header">
        <h1 class="title">Tasks</h1>
        <p class="subtitle">Simple, polished task manager</p>
      </header>

      <section class="task-creator" aria-label="Create task">
        <form id="taskForm">
          <div class="input-row">
            <label for="taskInput" class="visually-hidden">New task</label>
            <input id="taskInput" name="task" type="text" placeholder="Add a new task" autocomplete="off" required>

            <label for="prioritySelect" class="visually-hidden">Priority</label>
            <select id="prioritySelect" name="priority" aria-label="Priority">
              <option value="low" selected>Low</option>
              <option value="medium">Medium</option>
              <option value="urgent">Urgent</option>
            </select>

            <button id="addButton" type="submit" aria-label="Add task">Add</button>
          </div>
        </form>
      </section>

      <section class="stats" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Incomplete</span>
          <span id="incompleteCount" class="stat-value">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Completed</span>
          <span id="completedCount" class="stat-value">0</span>
        </div>
      </section>

      <section class="task-list" aria-label="Task list">
        <ul id="tasks" class="tasks" role="list"></ul>
      </section>

      <footer class="app-footer">
        <small>Stored locally in your browser.</small>
      </footer>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
